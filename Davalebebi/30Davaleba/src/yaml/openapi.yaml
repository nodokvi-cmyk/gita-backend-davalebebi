openapi: 3.0.0
info:
  title: 30 Davaleba API
  description: >-
    OpenAPI 3 specification written entirely in YAML (no Swagger decorators on
    controllers). Covers every route of every resource: App, Auth, Users,
    Products and Expenses.
  version: 1.0.0
  contact:
    name: 30 Davaleba
servers:
  - url: http://localhost:3000
    description: Local development server
tags:
  - name: App
    description: Root endpoints
  - name: Auth
    description: Authentication endpoints
  - name: Users
    description: User management endpoints
  - name: Products
    description: Product management endpoints
  - name: Expenses
    description: Expense tracking endpoints
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId of the resource
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{24}$"
    PageParam:
      name: page
      in: query
      required: false
      description: Page number, starts from 1
      schema:
        type: integer
        minimum: 1
        default: 1
    TakeParam:
      name: take
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 30
        default: 10
  responses:
    BadRequest:
      description: Bad request - payload or query validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized - missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
        statusCode:
          type: integer
